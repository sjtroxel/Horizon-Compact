[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-compact"
# Tracks the ROADMAP version spine: Phase 0 is v0.0. The package version and the git tag are the only two
# version numbers; a test keeps this file and src/horizon_compact/__init__.py in agreement.
version = "0.0.0"
description = "An experiment: the same model, given five different corporate objectives, deciding the same capital allocation."
# Upper bound is deliberate (Musical Mycelium's lesson): without it uv resolves to the newest interpreter on
# the machine, which then disagrees with CI and with the container image.
requires-python = ">=3.13,<3.14"
authors = [{ name = "sjtroxel" }]

# Each runtime dependency arrives with its subject: boto3 with the provider interface (Phase 0.5), pydantic with the
# decision schema (Phase 1). The name guard (horizon_compact.privacy) stays standard-library only, on purpose.
dependencies = [
    "boto3>=1.43.108",
    "pydantic>=2.13.5",
]

[project.scripts]
hc = "horizon_compact.cli:main"

[dependency-groups]
dev = [
  "boto3-stubs[bedrock,bedrock-runtime,ec2,ecs,s3,sts]>=1.43.108",
  "mypy>=2.4",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_compact"]

# --- lint + format -----------------------------------------------------------
# Every Python tool is configured here so that no per-tool file appears in the repo root.

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "C4",   # comprehensions
  "PTH",  # prefer pathlib
  "RUF",  # ruff-specific
]
# E501 is off because the formatter owns code width and cannot reflow prose; W505 limits docs instead.
ignore = ["E501"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 110

# --- types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true

# --- tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
