# Local guardrails. Install with `make setup`.
#
# The name guard (Phase 0) is the reason this file exists: it keeps real company names out of a public
# repository. It runs at three moments: on each commit's staged changes, on each commit message, and on
# each push. CI never runs it; CI cannot read the private term file (docs/planning/08 §4.8).
#
# The PUSH guard is not configured here. `make setup` installs src/horizon_compact/privacy/hooks/pre-push
# directly into the hooks directory, because pre-commit 4.6.2's `_pre_push_ns` returns None when no pushed
# ref has new commits, so it skips every pre-push hook: a tag-only push was never scanned. Found on tag day,
# 2026-10-13. Do not add a pre-push stage back to this file.
#
# ruff runs through `uv run`, not from ruff's own hook repository, so the hook, `make check` and CI all use
# the one ruff version pinned in uv.lock. A second pin is how a hook and CI come to disagree.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: name-guard
        name: name guard (staged paths and content)
        entry: uv run --no-sync python -m horizon_compact.privacy.guard pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # pass_filenames stays ON here: for a commit-msg hook, pre-commit delivers the message file as the
      # one "filename" (pre-commit 4.6.2, commands/run.py). Turning it off would hand the guard no file.
      - id: name-guard-message
        name: name guard (commit message)
        entry: uv run --no-sync python -m horizon_compact.privacy.guard commit-msg
        language: system
        always_run: true
        stages: [commit-msg]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Generated evidence allowed past the limit: Phase 3 step 10's simulation results (2.6 MB of text), and the
        # results files `hc analyze` writes (Phase 4 §6.8; a grid's is about 1.8 MB), never edited by hand. A
        # case's memo file (Phase 5.5 §5.4) is a .jsonl, allowed under experiment/results/cases/ only.
        exclude: ^(docs/phases/evidence/phase-3/simulation-results\.json|experiment/results/[^/]+/[^/]+/[^/]+\.json|experiment/results/cases/[^/]+/[^/]+\.jsonl)$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

# Deliberately NOT included: no-commit-to-branch. He commits directly to main.
