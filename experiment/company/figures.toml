[figures.operating_cash_flow_fy0]
label = "Cash from operations, year just ended"
unit = "usd_m"
formula = "net_income_fy0 + da_fy0 - wc_increase_fy0"

[figures.free_cash_flow_fy0]
label = "Free cash flow (cash from operations less capital spending), year just ended"
unit = "usd_m"
formula = "operating_cash_flow_fy0 - capex_fy0"

[figures.uncommitted_cash_flow]
label = "Cash flow after capital spending, dividends and repurchases, year just ended"
unit = "usd_m"
formula = "free_cash_flow_fy0 - dividends_fy0 - repurchases_fy0"
note = "The uncommitted cash a year produces at the current plans (the R&D scenario's annual amount draws on this row)."

