formula = "headcount_total * oews_emp_eng / oews_emp_all"
round = 10

[figures.hc_it]
label = "Employees, information technology"
unit = "count"
formula = "headcount_total * oews_emp_it / oews_emp_all"
round = 10

[figures.hc_sales]
label = "Employees, sales"
unit = "count"
formula = "headcount_total * oews_emp_sales / oews_emp_all"
round = 10

[figures.hc_office]
label = "Employees, office and administrative support"
unit = "count"
formula = "headcount_total * oews_emp_office / oews_emp_all"
round = 10

[figures.hc_business]
label = "Employees, business and financial operations"
unit = "count"
formula = "headcount_total * oews_emp_business / oews_emp_all"
round = 10

[figures.hc_mgmt]
label = "Employees, management"
unit = "count"
formula = "headcount_total * oews_emp_mgmt / oews_emp_all"
round = 10

[figures.hc_other]
label = "Employees, all other occupations"
unit = "count"
formula = "headcount_total - hc_prod - hc_maint - hc_logistics - hc_eng - hc_it - hc_sales - hc_office - hc_business - hc_mgmt"
note = "The remainder, so the functions add up to the total."

[figures.payroll_prod]
label = "Payroll, production"
unit = "usd_m"
formula = "hc_prod * oews_wage_prod"

[figures.payroll_maint]
label = "Payroll, maintenance, repair and field service"
unit = "usd_m"
formula = "hc_maint * oews_wage_maint"

[figures.payroll_logistics]
label = "Payroll, warehouse and shipping"
unit = "usd_m"
formula = "hc_logistics * oews_wage_logistics"

[figures.payroll_eng]
label = "Payroll, engineering"
unit = "usd_m"
formula = "hc_eng * oews_wage_eng"

[figures.payroll_it]
label = "Payroll, information technology"
unit = "usd_m"
formula = "hc_it * oews_wage_it"

[figures.payroll_sales]
label = "Payroll, sales"
unit = "usd_m"
formula = "hc_sales * oews_wage_sales"

[figures.payroll_office]
label = "Payroll, office and administrative support"
unit = "usd_m"
formula = "hc_office * oews_wage_office"

[figures.payroll_business]
label = "Payroll, business and financial operations"
unit = "usd_m"
formula = "hc_business * oews_wage_business"

[figures.payroll_mgmt]
label = "Payroll, management"
unit = "usd_m"
formula = "hc_mgmt * oews_wage_mgmt"

[figures.payroll_total]
label = "Payroll, total"
unit = "usd_m"
formula = "headcount_total * oews_wage_all"
note = "Headcount times the industry's mean wage across all occupations (OEWS). AIES's payroll share of revenue (17.8%, 2024) is higher than this gives (about 16.3%); the two surveys differ in what pay they count and in year, and pay by occupation needs OEWS, so OEWS is used throughout."

[figures.payroll_other]
label = "Payroll, all other occupations"
unit = "usd_m"
formula = "payroll_total - payroll_prod - payroll_maint - payroll_logistics - payroll_eng - payroll_it - payroll_sales - payroll_office - payroll_business - payroll_mgmt"
note = "The remainder, so payroll by function adds up to the total."

[figures.pay_other]
label = "Average pay, all other occupations"
unit = "usd"
formula = "payroll_other / hc_other"

[figures.benefits_total]
label = "Benefits cost, year just ended"
unit = "usd_m"
formula = "payroll_total * benefits_ratio"

[figures.employment_cost]
label = "Payroll and benefits, year just ended"
unit = "usd_m"
formula = "payroll_total + benefits_total"

