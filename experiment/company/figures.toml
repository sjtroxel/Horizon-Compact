# 6. Plants
# ============================================================================================================

[figures.plant_workforce]
label = "Employees at the plants (production, maintenance and warehouse)"
unit = "count"
formula = "hc_prod + hc_maint + hc_logistics"

[figures.office_workforce]
label = "Employees at the headquarters, engineering center and sales offices"
unit = "count"
formula = "headcount_total - plant_workforce"

[figures.plant_avg_pay]
label = "Average pay at the plants"
unit = "usd"
formula = "(payroll_prod + payroll_maint + payroll_logistics) / plant_workforce"

[figures.share_p1]
label = "Plant 1 share of revenue"
unit = "pct"
value = 0.24
assumption = { low = 0.20, high = 0.30, range_from = "no public plant-level source; six plants of unequal size", reason = "The largest plant, about a quarter of revenue." }

[figures.share_p2]
label = "Plant 2 share of revenue"
unit = "pct"
value = 0.20
assumption = { low = 0.15, high = 0.25, range_from = "no public plant-level source; six plants of unequal size", reason = "Sizes step down from Plant 1." }

[figures.share_p3]
label = "Plant 3 share of revenue"
unit = "pct"
value = 0.18
assumption = { low = 0.13, high = 0.23, range_from = "no public plant-level source; six plants of unequal size", reason = "Sizes step down from Plant 1." }

[figures.share_p4]
label = "Plant 4 share of revenue"
unit = "pct"
value = 0.15
assumption = { low = 0.10, high = 0.20, range_from = "no public plant-level source; six plants of unequal size", reason = "Sizes step down from Plant 1." }

[figures.share_p5]
label = "Plant 5 share of revenue"
unit = "pct"
value = 0.13
assumption = { low = 0.08, high = 0.18, range_from = "no public plant-level source; six plants of unequal size", reason = "Sizes step down from Plant 1." }

[figures.share_p6]
label = "Plant 6 share of revenue"
unit = "pct"
formula = "1 - share_p1 - share_p2 - share_p3 - share_p4 - share_p5"
note = "The remainder: the smallest plant, about a tenth of revenue."

[figures.rev_p1]
label = "Plant 1 revenue"
unit = "usd_m"
formula = "revenue_fy0 * share_p1"

[figures.rev_p2]
label = "Plant 2 revenue"
unit = "usd_m"
formula = "revenue_fy0 * share_p2"

[figures.rev_p3]
label = "Plant 3 revenue"
unit = "usd_m"
formula = "revenue_fy0 * share_p3"

[figures.rev_p4]
label = "Plant 4 revenue"
unit = "usd_m"
formula = "revenue_fy0 * share_p4"

[figures.rev_p5]
label = "Plant 5 revenue"
unit = "usd_m"
formula = "revenue_fy0 * share_p5"

[figures.rev_p6]
label = "Plant 6 revenue"
unit = "usd_m"
formula = "revenue_fy0 * share_p6"

[figures.hc_p2]
label = "Plant 2 employees"
unit = "count"
formula = "plant_workforce * share_p2"
round = 10
note = "Plant employees are spread in proportion to plant revenue (an assumption with no further source)."

[figures.hc_p3]
label = "Plant 3 employees"
unit = "count"
formula = "plant_workforce * share_p3"
round = 10

[figures.hc_p4]
label = "Plant 4 employees"
unit = "count"
formula = "plant_workforce * share_p4"
round = 10

[figures.hc_p5]
label = "Plant 5 employees"
unit = "count"
formula = "plant_workforce * share_p5"
round = 10

[figures.hc_p6]
label = "Plant 6 employees"
unit = "count"
formula = "plant_workforce * share_p6"
round = 10

[figures.hc_p1]
label = "Plant 1 employees"
unit = "count"
formula = "plant_workforce - hc_p2 - hc_p3 - hc_p4 - hc_p5 - hc_p6"
note = "The remainder, so the plants add up to the plant workforce."

[figures.margin_p2]
label = "Plant 2 operating margin, after allocated corporate costs"
unit = "pct"
value = 0.19
assumption = { low = 0.14, high = 0.24, range_from = "no public plant-level source; within five points of the Company's operating margin excluding Plant 6", reason = "Plants differ in product mix and age; spread so no plant other than Plant 6 is near breakeven." }

[figures.margin_p3]
label = "Plant 3 operating margin, after allocated corporate costs"
unit = "pct"
value = 0.17
assumption = { low = 0.12, high = 0.22, range_from = "no public plant-level source; within five points of the Company's operating margin excluding Plant 6", reason = "Plants differ in product mix and age; spread so no plant other than Plant 6 is near breakeven." }

[figures.margin_p4]
label = "Plant 4 operating margin, after allocated corporate costs"
unit = "pct"
value = 0.20
assumption = { low = 0.15, high = 0.25, range_from = "no public plant-level source; within five points of the Company's operating margin excluding Plant 6", reason = "Plants differ in product mix and age; spread so no plant other than Plant 6 is near breakeven." }

[figures.margin_p5]
label = "Plant 5 operating margin, after allocated corporate costs"
unit = "pct"
value = 0.15
assumption = { low = 0.10, high = 0.20, range_from = "no public plant-level source; within five points of the Company's operating margin excluding Plant 6", reason = "Plants differ in product mix and age; spread so no plant other than Plant 6 is near breakeven." }

[figures.margin_p6]
label = "Plant 6 operating margin, after allocated corporate costs"
unit = "pct"
value = -0.06
assumption = { low = -0.12, high = -0.02, range_from = "no public plant-level source; a loss small enough to be one plant's problem, not the Company's", reason = "The middle of the range. The outline needs one plant with an operating loss (section 8, row 6); the smallest plant is the one a subscale cost base would hit first." }

[figures.result_p2]
label = "Plant 2 operating result"
unit = "usd_m"
formula = "rev_p2 * margin_p2"

[figures.result_p3]
label = "Plant 3 operating result"
unit = "usd_m"
formula = "rev_p3 * margin_p3"

[figures.result_p4]
label = "Plant 4 operating result"
unit = "usd_m"
formula = "rev_p4 * margin_p4"

[figures.result_p5]
label = "Plant 5 operating result"
unit = "usd_m"
formula = "rev_p5 * margin_p5"

[figures.result_p6]
label = "Plant 6 operating result"
unit = "usd_m"
formula = "rev_p6 * margin_p6"

[figures.result_p1]
label = "Plant 1 operating result"
unit = "usd_m"
formula = "op_income_fy0 - result_p2 - result_p3 - result_p4 - result_p5 - result_p6"
note = "The remainder, so the plants add up to the Company's operating income."

[figures.margin_p1]
label = "Plant 1 operating margin, after allocated corporate costs"
unit = "pct"
formula = "result_p1 / rev_p1"

[figures.payroll_p6]
label = "Plant 6 payroll"
unit = "usd_m"
formula = "hc_p6 * plant_avg_pay"

