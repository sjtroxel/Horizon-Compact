unit = "years"
value = 2
assumption = { low = 1, high = 4, range_from = "no public industry-level source found", reason = "Near the middle of the range." }

# ============================================================================================================
# 11. Limits on each line (the maximum for every lever that can be a source)
# ============================================================================================================

[figures.max_wage_cut]
label = "Reduction in wages or hours the Company can make within a year, at most, as a share of payroll"
unit = "pct"
value = 0.10
assumption = { low = 0.05, high = 0.20, range_from = "no public industry-level source found; reduced schedules of a half day to a day a week", reason = "A half day a week, the lower middle of the range." }

[figures.wage_cut_cap]
label = "Payroll saving from cutting wages or hours, at most"
unit = "usd_m"
formula = "payroll_total * max_wage_cut"
