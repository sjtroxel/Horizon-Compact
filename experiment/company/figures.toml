locator = "Machinery, Book Debt to Capital"

[figures.receivables]
label = "Receivables, end of year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_ar_sales"

[figures.inventory]
label = "Inventory, end of year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_inv_sales"

[figures.payables]
label = "Payables, end of year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_ap_sales"

[figures.enterprise_value]
label = "Enterprise value"
unit = "usd_m"
formula = "ebitda_fy0 / ind_ebitda_ev"
note = "At the industry's EBITDA to enterprise value."

[figures.cash]
label = "Cash, end of year just ended"
unit = "usd_m"
formula = "enterprise_value * ind_cash_fv / (1 - ind_cash_fv)"
note = "Damodaran's cash to firm value, where firm value is enterprise value plus cash; solving cash = r x (EV + cash) gives cash = EV x r / (1 - r)."

[figures.market_cap]
label = "Market value of equity"
unit = "usd_m"
formula = "enterprise_value - debt + cash"

[figures.equity_book]
label = "Shareholders' equity (book), end of year just ended"
unit = "usd_m"
formula = "debt * (1 - ind_book_dc) / ind_book_dc"
note = "At the industry's book debt to capital, where capital is book debt plus book equity."

[figures.interest_coverage]
label = "Interest coverage (operating income to interest)"
unit = "ratio"
formula = "op_income_fy0 / interest_fy0"

[figures.min_cash_months]
label = "Minimum operating cash, in months of cash operating costs"
unit = "count"
value = 1
assumption = { low = 0.5, high = 2, range_from = "no public industry-level source found for the cash companies hold for operations; half a month to two months of cash operating costs", reason = "One month, a round figure inside the range." }

[figures.cash_costs_fy0]
label = "Cash operating costs, year just ended (revenue less EBITDA)"
unit = "usd_m"
formula = "revenue_fy0 - ebitda_fy0"

[figures.min_operating_cash]
label = "Minimum operating cash"
unit = "usd_m"
formula = "cash_costs_fy0 / 12 * min_cash_months"

[figures.cash_above_min]
label = "Cash above the minimum operating level"
unit = "usd_m"
formula = "cash - min_operating_cash"

[figures.credit_facility]
label = "Revolving credit facility, undrawn"
unit = "usd_m"
value = 300_000_000
assumption = { low = 150_000_000, high = 450_000_000, range_from = "no public industry-level source found for the size of undrawn credit lines; 10% to 30% of revenue", reason = "The middle of the range (20% of revenue), a round figure." }

[figures.liquidity]
label = "Available liquidity (cash plus the undrawn facility)"
unit = "usd_m"
formula = "cash + credit_facility"

