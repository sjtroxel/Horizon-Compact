round = 10

[figures.hc_maint]
label = "Employees, maintenance, repair and field service"
unit = "count"
formula = "headcount_total * oews_emp_maint / oews_emp_all"
round = 10

[figures.hc_logistics]
label = "Employees, warehouse and shipping"
unit = "count"
