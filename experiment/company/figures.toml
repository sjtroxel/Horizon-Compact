# --- the Company's income statement, year just ended -------------------------------------------------------

[figures.gross_profit_fy0]
label = "Gross profit, year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_gm_fy0"

[figures.sga_fy0]
label = "Selling, general and administrative expense, year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_sga_fy0"

[figures.rnd_fy0]
label = "Research and development expense, year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_rnd_fy0"

[figures.op_income_fy0]
label = "Operating income, year just ended"
unit = "usd_m"
formula = "gross_profit_fy0 - sga_fy0 - rnd_fy0"
note = "Gross margin less SG&A and R&D. Damodaran's own pre-tax operating margin for the year is 15.86%; the rounded line items (37.5% less 19.6% less 2.0%) give 15.9%, and the statement adds up from its own lines."

[figures.op_margin_fy0]
label = "Operating margin, year just ended"
unit = "pct"
formula = "op_income_fy0 / revenue_fy0"

[figures.ind_da_share]
label = "Industry depreciation and amortization as a share of revenue"
unit = "pct"
formula = "ind_da_total / ind_revenue_total"

[figures.da_fy0]
label = "Depreciation and amortization, year just ended"
unit = "usd_m"
formula = "revenue_fy0 * ind_da_share"

[figures.ebitda_fy0]
label = "EBITDA, year just ended"
unit = "usd_m"
formula = "op_income_fy0 + da_fy0"

[figures.ind_debt_ebitda]
label = "Industry debt to EBITDA"
unit = "ratio"
value = 2.3039265
source = "damodaran-2026-01-dbtfund"
locator = "Machinery, Debt to EBITDA"

[figures.ind_book_rate]
label = "Industry book interest rate"
unit = "pct"
value = 0.047970758
source = "damodaran-2026-01-debtdetails"
locator = "Machinery, Book interest rate"

[figures.ind_tax_rate]
label = "Industry effective tax rate, aggregate"
unit = "pct"
value = 0.21294562
source = "damodaran-2026-01-taxrate"
locator = "Machinery, Effective Tax Rates: Aggregate tax rate (the first of the two columns so named; the second is the cash rate)"

[figures.debt]
label = "Total debt, end of year just ended"
unit = "usd_m"
formula = "ebitda_fy0 * ind_debt_ebitda"
note = "Set at the industry's debt to EBITDA."

[figures.interest_fy0]
label = "Interest expense, year just ended"
unit = "usd_m"
formula = "debt * ind_book_rate"

[figures.pretax_income_fy0]
label = "Income before tax, year just ended"
unit = "usd_m"
formula = "op_income_fy0 - interest_fy0"

[figures.tax_fy0]
label = "Income tax, year just ended"
unit = "usd_m"
formula = "pretax_income_fy0 * ind_tax_rate"

[figures.net_income_fy0]
label = "Net income, year just ended"
unit = "usd_m"
formula = "pretax_income_fy0 - tax_fy0"

[figures.net_margin_fy0]
label = "Net margin, year just ended"
unit = "pct"
formula = "net_income_fy0 / revenue_fy0"

