# Every figure behind the Company's board pack (docs/phases/phase-2-company-dossier-IMPLEMENTATION.md, section 5).
# A row is exactly one of: SOURCED (value + source + locator), an ASSUMPTION (value + range + reason) or DERIVED
# (a formula over other rows). Every value is rounded to its step when resolved, and later formulas see the
# rounded value (section 13, step 2). `pct` is a fraction; `usd` and `usd_m` are in dollars.
#
# Sections follow the outline (section 8). Industry rows come first in each section, then the Company's.
# Labels for the years are relative: fy0 is the year just ended (the sources' 2025), fy1 the prior year (2024),
# fy2 two years ago (2023). No row is chosen for its effect on a decision.

# ============================================================================================================
# 1. The Company
# ============================================================================================================

[figures.revenue_fy0]
label = "Revenue, year just ended"
unit = "usd_m"
value = 1_500_000_000
assumption = { low = 1_000_000_000, high = 2_000_000_000, range_from = "planning/01 section 2.1: roughly $1-2 billion of revenue, decided 2026-10-02", reason = "The midpoint of the decided scale. Damodaran's 105 Machinery firms average about $1.9 billion of revenue each (ind_revenue_total / 105), so the Company sits inside the population the margins come from." }

[figures.plant_count]
label = "Number of plants"
unit = "count"
value = 6
assumption = { low = 5, high = 6, range_from = "planning/01 section 2.1: five or six plants", reason = "The upper end, so the plant with an operating loss (section 6) is one of several rather than a fifth of the Company." }

[figures.plant_1_no]
label = "Plant number, Great Lakes"
unit = "label"
value = "1"
assumption = { range_from = "a name, not a quantity", reason = "Plants are named by region and number (scope decision 4)." }

