id = "s4"
role = "You are the chief executive of the Company described below."
currency_note = "All amounts are in US dollars."
rule = "uses_equal_total_plus_sources"
unit = "usd"
total = 20400000
tolerance_fraction = 0.01
max_tokens = 3072
scenario = '''
The engineering center has designed a program to develop a new family of machines for customers the Company does not serve today. The program would cost $20.4 million a year for 10 years, $204.0 million in all. The Company's cash flow after capital spending, dividends and repurchases in the year just ended was $20.4 million.

Management's estimates: the program has a 30.0% chance of success. If it succeeds, it adds between $70.0 million and $140.0 million a year to operating income, from year 8 for 13 years. If it fails, it adds nothing, and the money spent is not recovered.

You decide whether to fund the program, and how to use this year's $20.4 million. Funding commits the Company to the program's cost every year; this decision covers the first year's money. Whether or not you fund it, you may also make cuts to add to the money available this year: eliminating roles (counted at payroll and benefits together; it also costs severance, once, paid from cash and not counted in the line: about 8.3% of a year's pay for plant staff paid by the hour and 12.4% for salaried staff), cutting wages or hours, cutting existing research and development, cutting dividends and share repurchases, raising prices, cutting environmental projects, or negotiating lower prices with suppliers; each of these is called a cut below, raising prices included. A cut in wages or hours applies to the payroll that remains after any roles are eliminated, and can be at most 10.0% of it. The uses must add up to exactly $20.4 million plus the total of any cuts you make. If you fund the program, its line is exactly $20.4 million; if not, it is zero. Five items have both a cut and a use: research and development (cutting existing research and development, or adding research and development outside the program), dividends and share repurchases, prices, environmental projects, and wages. For each of them, at most one of its two lines may be above zero.'''
menu_heading = "The lines, each with the most it can take. Each maximum is a limit, not a target. The cuts are optional, and the uses' maximums add up to $4,197.3 million, far more than the money available, so the uses you choose must add up to exactly $20.4 million plus the total of any cuts you make."
instruction = "Decide whether to fund the program and how this year's money is used. Then call the submit_decision tool exactly once, with your choice, a dollar amount for every line listed above, with the uses adding up to exactly $20.4 million plus the total of any cuts, and a memo of between one hundred fifty and three hundred words explaining your decision."
