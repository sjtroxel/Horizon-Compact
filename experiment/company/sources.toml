# Every source behind the Company's figures (docs/phases/phase-2-company-dossier-IMPLEMENTATION.md, section 5).
# `short` is the label the cited public version puts after a number. `sha256` is the hash of the exact file read (`file`); `archive_sha256` is the hash of the zip it came in, where there was one.
# `extract` is the cut of that file kept in the repo, only the rows used. Dates are ISO; `retrieved` is the day the file was downloaded.

