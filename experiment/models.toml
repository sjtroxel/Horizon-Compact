# How each model is reached, its quota and its prices. Config read by the harness; never hard-coded.
#
# Prices: AWS Price List, us-east-1, USD per million tokens. Sonnet 4.6 rows are the US geo route ("Regional CRIS"),
# read from the AmazonBedrockFoundationModels offer file published 2026-09-30, on 2026-10-04. Nova Lite from the
# AmazonBedrock offer file published 2026-10-03. Re-checked live before any official sweep (planning/03).
#
# Quotas: requests per minute (Sonnet 4.6: planning/04 section 3.1, read 2026-10-03). The harness paces at
# pace_fraction of the quota, leaving headroom for development calls on the same account. UNVERIFIED as the enforced
# limit: on 2026-10-05 the console and the API both showed 0 applied for these models while calls worked, so the real
# limit is unknown and the cautious values are kept (Phase 1 IMPLEMENTATION doc section 21).

pace_fraction = 0.8

[models.sonnet-4-6]
model_id = "anthropic.claude-sonnet-4-6"
# route is decision 3's outcome (Phase 0.5): "application_profile" if the Project tag lands on Marketplace
# charges, else "geo_profile". Both behave identically on the request path (Phase 0.5 smoke records 01 and 03).
route = "application_profile"
inference_profile = "horizon-compact-sonnet-4-6"
geo_profile_id = "us.anthropic.claude-sonnet-4-6"
requests_per_minute = 10
# Out of v1 under the fallback set (Phase 3.5 IMPLEMENTATION doc section 23, decision 5): kept so a Bedrock set stays
# possible before the tag, and because the smoke plan and many tests name it. Any role other than "development" keeps
# real content away from it before the official sweep (section 24).
role = "reserve"

[models.sonnet-4-6.prices]
input = 3.30
output = 16.50
cache_read = 0.33
cache_write_5m = 4.125

[models.nova-lite]
model_id = "amazon.nova-lite-v1:0"
route = "in_region"
# UNVERIFIED: a conservative placeholder. Read 2026-10-05: 0 applied (default 2,000), while calls work; see above.
requests_per_minute = 20
role = "development"

[models.nova-lite.prices]
input = 0.06
output = 0.24
cache_read = 0.015
cache_write_5m = 0.0

# A local model, run through Ollama on this laptop. It is the development model's first half (Phase 0.5 decision
# 8: Ollama qwen3.5:4b plus Nova Lite): it tests format and plumbing, and never produces a result. `model_id` is the
# Ollama tag. `num_ctx` is the context window sent on every call (Phase 2.5 IMPLEMENTATION doc section 17 step 4:
# the model's own maximum is 262,144 tokens, and 16,384 uses 3,379 MiB of the laptop's 6,141 MiB, all in VRAM; the
# company's dossier alone is about 4,700 tokens on this tokenizer, so a call with a scenario, the tool and the
# reply needs roughly 7,000 to 8,000). No quota applies, and calls run one at a time, so the
# rate only spaces call starts; it stays low enough that a slow GPU is never asked for more than it can do. Prices
# are zero. It cannot run in the container and takes no AWS credentials.

[models.qwen-local]
model_id = "qwen3.5:4b"
route = "local"
num_ctx = 16384
requests_per_minute = 30
role = "development"

[models.qwen-local.prices]
input = 0.0
output = 0.0
cache_read = 0.0
cache_write_5m = 0.0

# gpt-oss-120b through OpenRouter: the development model for Phase 2.5's runs on real content while Bedrock is
# blocked (his decision 9, 2026-10-07; `$3` cap on his key). It tests format and wording, and never produces a
# result. `model_id` is OpenRouter's. Prices checked live on 2026-10-07 from OpenRouter's public model list
# (openrouter.ai/api/v1/models): $0.037 per million input tokens, $0.17 per million output tokens. The harness
# counts cost from tokens and these prices; a cached prompt is counted at the input price (an overestimate),
# and the cost OpenRouter reports is kept in each stored response. On the laptop its key is typed in; in the
# container it is read from SSM (Phase 4 code half section 4.8). `openrouter_provider` pins the request to
# DeepInfra's bf16 endpoint, the one the prices below belong to (checked live 2026-10-11 against OpenRouter's
# endpoint list; re-read 2026-10-12, docs/phases/evidence/phase-3.5/model-facts.md), with fallbacks off.
#
# Role, 2026-10-12 (Phase 3.5 IMPLEMENTATION doc section 24, his): "second_family". Under the fallback set this is the
# official second family, so it is no longer a development model and the real-content refusals apply to it. It is also
# the model the instrument's text was developed on (protocol section 2.4 and 9.4).

[models.gpt-oss-openrouter]
model_id = "openai/gpt-oss-120b"
route = "openrouter"
openrouter_provider = "deepinfra/bf16"
# Its reasoning cannot be turned off (OpenRouter's models API, read 2026-10-12: mandatory, efforts low/medium/high,
# default medium). Sent explicitly so the level is pre-registered and in the lock, not left to OpenRouter's default
# (Phase 3.5 IMPLEMENTATION doc section 25, his). Equal to the default today, so it changes no measured behavior.
reasoning_effort = "medium"
requests_per_minute = 20
role = "second_family"

[models.gpt-oss-openrouter.prices]
input = 0.037
output = 0.17
cache_read = 0.037
cache_write_5m = 0.037

# Haiku 5.5 through Anthropic's own API: the fallback set's main model, taken on 2026-10-12 (Phase 3.5 IMPLEMENTATION
# doc section 23, decision B). It is paid from his prepaid Console credit, through a key made inside the
# `horizon-compact` workspace, which carries a $10 monthly spend limit (decision G). The harness counts cost from
# tokens and these prices (USD per million tokens, the page for claude-haiku-5-5 read 2026-10-11, for prompts up
# to 100,000 tokens; the grid's prompts are about 8,000). `thinking = "off"` sends `thinking: {type: disabled}`
# (decision C): the model thinks by default, and the protocol asks for the explicit field that turns it off.
# Quota: his organization's Scale tier showed 10K requests, 10.0M input and 2.0M output tokens for this model
# (the Console's Rate limits page, workspace horizon-compact, read 2026-10-12); the pace below is far under it.
# Role, 2026-10-12 (Phase 3.5 IMPLEMENTATION doc section 24, his): "main". Any role other than "development" keeps
# real content away from it before the official sweep. The container reads the key from SSM
# (`/horizon-compact/anthropic-key`).

[models.haiku-5-5]
model_id = "claude-haiku-5-5"
route = "anthropic"
thinking = "off"
requests_per_minute = 60
role = "main"

[models.haiku-5-5.prices]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125

# Claude Sonnet 5.5 through Anthropic's own API: the extraction model for Phase 5's real cases, the one that
# summarizes pre-cut-off filings into a dossier's sections (search-half IMPLEMENTATION doc section 8 decision 2,
# his, 2026-10-15). It is NOT an experiment model: `ModelsFile` keeps the role out of `models`, so no sweep,
# probe, awareness check or lock can name it, and only `hc case build` reads it. Same route as the main
# model, so it is paid from the prepaid Console credit through the `horizon-compact` workspace's key. `model_id`
# and prices read live 2026-10-16 from Anthropic's models overview and pricing pages: `claude-sonnet-5-5`, $2 per
# million input tokens, $10 output, $2.50 for a 5-minute cache write, $0.10 for a cache read, one rate across the
# whole 1M-token context. Its training data ends June 2026 (same page), before the fallback month and the window.
# Thinking is off: `thinking = "between_tools"` sends `thinking: {type: between_tools}`, the lowest setting on this
# model, because Sonnet 5.5 refuses `{type: disabled}` with a 400 (read live 2026-10-16, Anthropic's Sonnet 5.5
# migration guide: with no tools the model does not think and the reply is text only; accepted at the default
# effort, `high`). `max_tokens` is the allowance of every extraction call,
# fixed here (the section summaries are short; a reply cut off at it is an error, never a partial section).
# `requests_per_minute` is unused by the builder (calls run one at a time) and kept because the file requires it.

[models.sonnet-5-5-extraction]
model_id = "claude-sonnet-5-5"
route = "anthropic"
thinking = "between_tools"
max_tokens = 4096
requests_per_minute = 30
role = "extraction"

[models.sonnet-5-5-extraction.prices]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write_5m = 2.50
