name: AWS permission check

# MANUAL ONLY, from main (the deploy role's trust is pinned to refs/heads/main). Proves the deploy role CANNOT do
# six things it must never do (Phase 1 definition of done 5; the last two, Phase 1.5 definition of done 8). Each
# attempt must be refused with an access error: a command that fails for any other reason (a typo, a missing
# argument, an invalid value) does not count as "refused", so the check cannot pass by being broken. If any attempt succeeds, the job cleans up what it can and fails.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: attempt six forbidden actions
    runs-on: ubuntu-latest
    steps:
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Attempt each forbidden action
        shell: bash
        run: |
          set +e
          failures=0
          trust='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
          policy='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"*","Resource":"*"}]}'
          bucket="hc-escalation-test-${GITHUB_RUN_ID}"

          # Runs one command; passes only if it fails AND says it was denied.
          expect_refused() {
            local name="$1"; shift
            local out
            out=$("$@" 2>&1)
            local code=$?
            echo "--- $name (exit $code)"
            echo "$out" | sed -E 's/[0-9]{12}/<account-id>/g' | head -5
            if [ "$code" -eq 0 ]; then
              echo "FAIL: $name SUCCEEDED, which must never happen"
              failures=$((failures + 1))
              return 1
            fi
            if ! echo "$out" | grep -qiE "AccessDenied|not authorized|explicit deny"; then
              echo "FAIL: $name failed, but not with an access error, so it proves nothing"
              failures=$((failures + 1))
              return 1
            fi
            echo "PASS: $name refused"
          }

          expect_refused "create a role without the boundary" \
            aws iam create-role --role-name horizon-compact-escalation-test \
              --assume-role-policy-document "$trust" \
          || aws iam delete-role --role-name horizon-compact-escalation-test >/dev/null 2>&1

          expect_refused "create a bucket outside the project" \
            aws s3api create-bucket --bucket "$bucket" \
          || aws s3api delete-bucket --bucket "$bucket" >/dev/null 2>&1

          expect_refused "put an inline policy on its own role" \
            aws iam put-role-policy --role-name horizon-compact-github-deploy \
              --policy-name escalation-test --policy-document "$policy" \
          || aws iam delete-role-policy --role-name horizon-compact-github-deploy \
              --policy-name escalation-test >/dev/null 2>&1

          expect_refused "run a task" \
            aws ecs run-task --cluster horizon-compact --task-definition horizon-compact-sweep \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-00000000]}"

          # Phase 1.5: another project's distribution (any not carrying this project's comment). Neither attempt
          # can change it even if the fence were missing: the first sends a stale ETag, and the second carries a
          # tag value over CloudFront's 256-character limit, so the call could only fail. Each must instead be
          # refused before it is read.
          other="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment!='horizon-compact site'] | [0].ARN" --output text)"
          if [ -z "$other" ] || [ "$other" = "None" ]; then
            echo "FAIL: no other project's distribution to test the fence against"
            failures=$((failures + 2))
          else
            other_id="${other##*/}"
            too_long="$(printf 'x%.0s' $(seq 1 300))"

            expect_refused "delete another project's distribution" \
              aws cloudfront delete-distribution --id "$other_id" --if-match E0000000000000

            expect_refused "claim another project's distribution by tag" \
              aws cloudfront tag-resource --resource "$other" \
                --tags "Items=[{Key=Project,Value=horizon-compact},{Key=hc-check,Value=${too_long}}]"
          fi

          echo
          if [ "$failures" -ne 0 ]; then
            echo "$failures of 6 checks failed"
            exit 1
          fi
          echo "All six forbidden actions were refused."
